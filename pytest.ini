[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=scripts
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=80
markers =
    unit: Unit tests for individual modules
    integration: Integration tests requiring MCP
    slow: Slow running tests
